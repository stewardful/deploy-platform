[package]
name = "ingress"
description = "Durable domain coordination with an optional Caddy adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
caddy = ["dep:bytes", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dependencies]
ingress-model.workspace = true
agent-api.workspace = true
app-model.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client"], optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
