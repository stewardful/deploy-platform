[workspace]
members = [
    "crates/ingress-model",
    "crates/node-resources",
    "crates/app-model",
    "crates/runtime-api",
    "crates/runtime-nerdctl",
    "crates/agent-store-sqlite",
    "crates/agent-api",
    "crates/agent-core",
    "crates/ingress",
    "apps/agent",
]
resolver = "3"

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
agent-core = { path = "crates/agent-core", version = "0.5.3" }
ingress = { path = "crates/ingress", version = "0.5.3", default-features = false }
ingress-model = { path = "crates/ingress-model", version = "0.5.3" }
node-resources = { path = "crates/node-resources", version = "0.5.3" }
app-model = { path = "crates/app-model", version = "0.5.3" }
runtime-api = { path = "crates/runtime-api", version = "0.5.3" }
runtime-nerdctl = { path = "crates/runtime-nerdctl", version = "0.5.3" }
agent-store-sqlite = { path = "crates/agent-store-sqlite", version = "0.5.3" }
agent-api = { path = "crates/agent-api", version = "0.5.3", default-features = false }
bytes = "1"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal", "net", "sync"] }
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
