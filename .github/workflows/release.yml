name: Offline Ubuntu installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Platform release version
        required: true
        default: '0.5.0'
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup default 1.96.0
      - run: make installer-test
      - name: Build offline installer on build machine
        env:
          VERSION: ${{ inputs.version }}
        run: make release-build
      - name: Verify self-extracting package
        run: bash target/dist/deploy-platform-*-linux-${{ matrix.arch }}.run --check
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-platform-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
