name: Dev prerelease and optional deployment
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dev-release-and-optional-deploy
  # Never cancel an installer already changing services on the node.
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/build-installers.yml
    with:
      arch: both
      delivery: true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: deploy-platform-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: cloudctl
          path: dist
      - name: Publish immutable dev build and latest discovery pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/ci/dev-release.py
  deploy:
    # Publishing never requires server secrets. Default is OFF.
    if: vars.TEST_SERVER_AUTO_DEPLOY == 'true'
    timeout-minutes: 50
    needs: [build, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: current
        name: Skip superseded dev commits before contacting the server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/dev" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer dev commit exists; skipping this deployment.'
          fi
      - uses: actions/download-artifact@v7
        if: steps.current.outputs.deploy == 'true'
        with:
          name: deploy-platform-linux-${{ vars.TEST_SERVER_ARCH || 'amd64' }}
          path: dist
      - name: Call cloudctl for protected HTTPS deployment
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_DIR: ${{ github.workspace }}/dist
          DEPLOY_WAIT_SECONDS: '2400'
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
          TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          TEST_SERVER_PORT: ${{ secrets.TEST_SERVER_PORT || '22' }}
          TEST_SERVER_ARCH: ${{ vars.TEST_SERVER_ARCH || 'amd64' }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: bash distribution/ci/deploy-test.sh
