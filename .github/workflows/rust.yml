name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable check -p agent-api --no-default-features --locked
      - run: cargo +stable check -p agent-api --no-default-features --features client --locked
      - run: cargo +stable check -p agent-api --no-default-features --features server --locked
      - run: cargo +stable check -p ingress --no-default-features --locked
      - run: cargo +stable check -p ingress --no-default-features --features caddy --locked
      - run: cargo +stable test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets --locked
