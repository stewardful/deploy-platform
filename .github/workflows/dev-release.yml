name: Dev prerelease
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dev-prerelease
  # Serialize updates to the latest discovery pointer.
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/build-installers.yml
    with:
      arch: both
      platform-update: true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: deploy-platform-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: cloudctl
          path: dist
      - name: Publish immutable dev build and latest discovery pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/ci/dev-release.py
