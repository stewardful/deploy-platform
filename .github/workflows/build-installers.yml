name: Reusable tested Ubuntu installers
on:
  workflow_call:
    inputs:
      arch:
        description: amd64, arm64 or both
        type: string
        default: both
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.version.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          BUILD_ARCH: ${{ inputs.arch }}
        run: python3 distribution/ci/version.py
  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy && rustup default 1.96.0
      - run: npm ci
      - run: make check test shellcheck workflow-check
      - run: npx playwright install --with-deps chromium
      - run: make web-e2e
  package:
    needs: [validate, test]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - name: Build offline installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: make release-build
      - name: Verify installer and checksums
        run: |
          bash target/dist/deploy-platform-*-linux-${{ matrix.arch }}.run --check
          cd target/dist
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-platform-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
