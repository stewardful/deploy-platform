name: Reusable tested Ubuntu installers
on:
  workflow_call:
    inputs:
      arch:
        description: amd64, arm64 or both
        type: string
        default: both
      platform-update:
        description: Build platform updates without bundling reusable runtime dependencies
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.version.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          BUILD_ARCH: ${{ inputs.arch }}
        run: python3 distribution/ci/version.py
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -B distribution/cli/package.py
      - run: python3 -I -B target/cli/cloudctl install --help && python3 -I -B target/cli/cloudctl version
      - run: cd target/cli && sha256sum -c cloudctl.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: cloudctl
          path: target/cli/*
          if-no-files-found: error
          retention-days: 14
  test:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy && rustup default 1.96.0
      - run: npm ci
      - run: make check test shellcheck workflow-check
      - run: npx playwright install --with-deps chromium
      - run: make web-e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: installer-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  package:
    needs: [validate, test]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - name: Build requested platform package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_KIND: ${{ inputs.platform-update && 'platform-update' || 'offline' }}
        run: make release-build
      - name: Verify installer and checksums
        run: |
          bash target/dist/deploy-platform-*-linux-${{ matrix.arch }}.run --check
          cd target/dist
          sha256sum -c ./*.sha256
      - name: Build and check the formal offline package on PRs
        if: github.event_name == 'pull_request' && inputs.platform-update
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_KIND: offline
          RELEASE_OUTPUT: target/offline
        run: |
          make release-build
          bash target/offline/deploy-platform-*-linux-${{ matrix.arch }}.run --check
          cd target/offline
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request' && inputs.platform-update
        with:
          name: deploy-platform-offline-linux-${{ matrix.arch }}
          path: |
            target/offline/*.run
            target/offline/*.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: ${{ !inputs.platform-update }}
        with:
          name: deploy-platform-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: inputs.platform-update
        with:
          name: deploy-platform-linux-${{ matrix.arch }}
          path: |
            target/dist/*.run
            target/dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
