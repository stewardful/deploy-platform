[package]
name = "node-agent"
description = "Standalone application deployment and diagnostics CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agentctl"
path = "src/main.rs"

[[bin]]
name = "agentd"
path = "src/bin/agentd.rs"

[dependencies]
ingress-model.workspace = true
ingress = { workspace = true, features = ["caddy"] }
agent-core.workspace = true
node-resources.workspace = true
app-model.workspace = true
runtime-api.workspace = true
runtime-nerdctl.workspace = true
serde.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
agent-store-sqlite.workspace = true
agent-api = { workspace = true, features = ["client", "server"] }
tokio-util.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
async-trait.workspace = true

[lints]
workspace = true
